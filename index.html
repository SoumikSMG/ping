<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b141a;
      color: #e9edef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .bubble {
      background-color: #202c33;
      color: #e9edef;
      padding: 14px 22px;
      border-radius: 18px;
      font-size: 1.05rem;
      line-height: 1.4;
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: opacity 0.35s ease, transform 0.35s ease, background-color 0.2s ease;
    }

    .bubble:active {
      transform: scale(0.96);
    }

    .bubble.hi {
      background-color: #005c4b;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 16px 32px;
      cursor: default;
      margin-bottom: 12px;
    }

    .reply-option {
      background-color: #202c33;
      color: #53bdeb;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid rgba(83, 189, 235, 0.25);
      transition: transform 0.2s ease, background-color 0.2s ease, opacity 0.4s ease;
    }

    .reply-option:hover, .reply-option:active {
      background-color: #2a3942;
      transform: scale(0.98);
    }

    .hint {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #8696a0;
      letter-spacing: 0.3px;
      transition: opacity 0.3s ease;
    }

    .hidden {
      opacity: 0;
      transform: translateY(-8px) scale(0.95);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="bubble" id="activeBubble" onclick="nextStep()">knock knock</div>
    <div class="hint" id="hint">tap to open</div>
  </div>

  <script>
    // REPLACE WITH YOUR WHATSAPP NUMBER (Country code + 10-digit number, no '+' or spaces)
    const PHONE_NUMBER = "919876543210";

    let step = 0;
    const stage = document.getElementById("stage");
    const bubble = document.getElementById("activeBubble");
    const hint = document.getElementById("hint");

    function nextStep() {
      if (step === 0) {
        step = 1;
        swapText("just checking if it works");
      } else if (step === 1) {
        step = 2;
        swapText("HI", true);
      }
    }

    function swapText(newText, isFinal = false) {
      bubble.classList.add("hidden");
      hint.classList.add("hidden");

      setTimeout(() => {
        bubble.textContent = newText;

        if (isFinal) {
          bubble.classList.add("hi");
          bubble.onclick = null;
          bubble.classList.remove("hidden");

          setTimeout(() => {
            showReplyOptions();
          }, 450);
        } else {
          bubble.classList.remove("hidden");
          hint.textContent = "tap again";
          hint.classList.remove("hidden");
        }
      }, 360);
    }

    function showReplyOptions() {
      const replies = ["so did it work ?", "did I get a reply ?"];

      replies.forEach((text, index) => {
        const btn = document.createElement("div");
        btn.className = "reply-option hidden";
        btn.textContent = text;
        btn.onclick = () => sendToWhatsApp(text);
        stage.appendChild(btn);

        setTimeout(() => {
          btn.classList.remove("hidden");
        }, 120 * (index + 1));
      });
    }

    function sendToWhatsApp(message) {
      const encoded = encodeURIComponent(message);
      window.location.href = `https://wa.me/${PHONE_NUMBER}?text=${encoded}`;
    }
  </script>
</body>
</html>
